<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar System</title>
  <style>
    :root {
      --bg: #05070d;
      --fg: #eef1f7;
      --muted: #9aa3b5;
      --panel: rgba(16, 21, 34, 0.86);
      --line: rgba(255, 255, 255, 0.14);
      --accent: #ffd166;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
    }
    header {
      position: fixed;
      top: 12px;
      left: 16px;
      right: 16px;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    #info {
      position: fixed;
      top: 76px;
      right: 16px;
      width: min(280px, calc(100% - 32px));
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }
    #info[hidden] { display: none; }
    #info h2 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: none;
    }
    #info p { margin: 0 0 10px; font-size: 0.9rem; color: var(--muted); }
    #info dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      font-size: 0.85rem;
    }
    #info dt { color: var(--muted); }
    #info dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    #close {
      position: absolute;
      top: 6px;
      right: 8px;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    #controls {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 12px;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }
    #chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 320px; }
    button.chip, #toggle {
      font: inherit;
      font-size: 0.8rem;
      color: var(--fg);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button.chip[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #toggle { min-width: 64px; }
    .speed {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .speed input { width: 120px; accent-color: var(--accent); }
    #speedLabel { min-width: 86px; font-variant-numeric: tabular-nums; }
    @media (max-width: 560px) {
      #info { top: auto; bottom: 150px; right: 16px; left: 16px; width: auto; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="Animated diagram of the solar system"></canvas>

  <header>
    <h1>Solar System</h1>
    <p>Click a planet to learn about it. Sizes and distances are not to scale.</p>
  </header>

  <aside id="info" hidden aria-live="polite">
    <button id="close" aria-label="Close">&times;</button>
    <h2><span id="swatch"></span><span id="name"></span></h2>
    <p id="fact"></p>
    <dl id="stats"></dl>
  </aside>

  <div id="controls">
    <div id="chips"></div>
    <label class="speed">
      Speed
      <input id="speed" type="range" min="1" max="365" value="30">
      <span id="speedLabel"></span>
    </label>
    <button id="toggle">Pause</button>
  </div>

  <script>
    const bodies = [
      { name: 'Sun', color: '#ffd166', size: 16, fact: 'The star at the centre of the solar system. It holds about 99.8% of the system\'s total mass.',
        stats: { 'Type': 'Yellow dwarf star', 'Diameter': '1,392,700 km', 'Surface temp.': 'about 5,500 °C' } },
      { name: 'Mercury', color: '#b5b0a8', size: 3, period: 88, fact: 'The smallest planet and the closest to the Sun. It has almost no atmosphere.',
        stats: { 'Distance from Sun': '57.9 million km', 'Diameter': '4,879 km', 'Year': '88 Earth days', 'Moons': '0' } },
      { name: 'Venus', color: '#e6c58a', size: 5, period: 224.7, fact: 'The hottest planet, wrapped in thick clouds. It spins in the opposite direction to most planets.',
        stats: { 'Distance from Sun': '108.2 million km', 'Diameter': '12,104 km', 'Year': '225 Earth days', 'Moons': '0' } },
      { name: 'Earth', color: '#5fa8ff', size: 5.5, period: 365.25, fact: 'Our home, and the only world known to have life. About 71% of its surface is water.',
        stats: { 'Distance from Sun': '149.6 million km', 'Diameter': '12,756 km', 'Year': '365.25 days', 'Moons': '1' } },
      { name: 'Mars', color: '#e0704f', size: 4, period: 687, fact: 'The red planet. It has the tallest volcano in the solar system, Olympus Mons.',
        stats: { 'Distance from Sun': '227.9 million km', 'Diameter': '6,792 km', 'Year': '687 Earth days', 'Moons': '2' } },
      { name: 'Jupiter', color: '#d9b38c', size: 11, period: 4333, fact: 'The largest planet, a gas giant. Its Great Red Spot is a storm bigger than Earth.',
        stats: { 'Distance from Sun': '778.6 million km', 'Diameter': '142,984 km', 'Year': '11.9 Earth years', 'Moons': '95 or more' } },
      { name: 'Saturn', color: '#e8d59a', size: 9.5, period: 10759, ring: true, fact: 'A gas giant famous for its bright rings, made mostly of ice and rock.',
        stats: { 'Distance from Sun': '1,433.5 million km', 'Diameter': '120,536 km', 'Year': '29.5 Earth years', 'Moons': 'more than 140' } },
      { name: 'Uranus', color: '#9be3e8', size: 7.5, period: 30687, fact: 'An ice giant that rotates tipped over on its side.',
        stats: { 'Distance from Sun': '2,872.5 million km', 'Diameter': '51,118 km', 'Year': '84 Earth years', 'Moons': '28 or more' } },
      { name: 'Neptune', color: '#5b7fe8', size: 7.2, period: 60190, fact: 'The most distant planet, an ice giant with the fastest winds in the solar system.',
        stats: { 'Distance from Sun': '4,495.1 million km', 'Diameter': '49,528 km', 'Year': '165 Earth years', 'Moons': '16' } }
    ];

    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');
    const chips = document.getElementById('chips');
    const speedInput = document.getElementById('speed');
    const speedLabel = document.getElementById('speedLabel');
    const toggle = document.getElementById('toggle');

    const stars = Array.from({ length: 220 }, () => ({
      x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.2, a: Math.random() * 0.6 + 0.2
    }));
    // Give each planet a random starting angle so they are spread around the Sun.
    bodies.forEach(b => { b.phase = Math.random() * Math.PI * 2; b.x = 0; b.y = 0; b.r = 0; });

    let width = 0, height = 0, cx = 0, cy = 0, scale = 1;
    let days = 0, last = performance.now();
    let running = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let selected = null, hovered = null;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Leave room for the header at the top and the controls at the bottom.
      const top = 64, bottom = width < 560 ? 140 : 84;
      cx = width / 2;
      cy = top + (height - top - bottom) / 2;
      const maxR = Math.max(60, Math.min(width / 2 - 16, (height - top - bottom) / 2 - 8));
      scale = Math.min(1.3, Math.max(0.5, maxR / 300));
      const minR = bodies[0].size * scale + 14 * scale;
      bodies.forEach((b, i) => {
        b.r = b.size * scale;
        b.orbit = i === 0 ? 0 : minR + (i - 1) * (maxR - b.r - minR) / (bodies.length - 2);
      });
    }

    function place() {
      bodies.forEach(b => {
        if (!b.period) { b.x = cx; b.y = cy; return; }
        const angle = b.phase + (days / b.period) * Math.PI * 2;
        b.x = cx + Math.cos(angle) * b.orbit;
        b.y = cy - Math.sin(angle) * b.orbit;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      stars.forEach(s => {
        ctx.globalAlpha = s.a;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      bodies.forEach(b => {
        if (!b.period) return;
        ctx.strokeStyle = b === selected ? 'rgba(255, 209, 102, 0.6)' : 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, b.orbit, 0, Math.PI * 2);
        ctx.stroke();
      });

      bodies.forEach(b => {
        if (!b.period) {
          const glow = ctx.createRadialGradient(cx, cy, b.r * 0.4, cx, cy, b.r * 2.6);
          glow.addColorStop(0, 'rgba(255, 209, 102, 0.55)');
          glow.addColorStop(1, 'rgba(255, 209, 102, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, b.r * 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
        if (b.ring) {
          ctx.strokeStyle = 'rgba(232, 213, 154, 0.75)';
          ctx.lineWidth = Math.max(1.5, 2 * scale);
          ctx.beginPath();
          ctx.ellipse(b.x, b.y, b.r * 1.9, b.r * 0.6, -0.4, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();

        if (b === selected || b === hovered) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r + 4, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#fff';
          ctx.font = '12px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(b.name, b.x, b.y - b.r - 10);
        }
      });
    }

    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (running) days += dt * Number(speedInput.value);
      place();
      draw();
      requestAnimationFrame(frame);
    }

    function bodyAt(x, y) {
      let best = null, bestD = Infinity;
      bodies.forEach(b => {
        const d = Math.hypot(x - b.x, y - b.y);
        if (d <= Math.max(b.r + 4, 14) && d < bestD) { best = b; bestD = d; }
      });
      return best;
    }

    function select(b) {
      selected = b;
      [...chips.children].forEach(c => c.setAttribute('aria-pressed', String(b && c.textContent === b.name)));
      if (!b) { info.hidden = true; return; }
      document.getElementById('name').textContent = b.name;
      document.getElementById('swatch').style.background = b.color;
      document.getElementById('fact').textContent = b.fact;
      const stats = document.getElementById('stats');
      stats.textContent = '';
      Object.entries(b.stats).forEach(([k, v]) => {
        const dt = document.createElement('dt');
        const dd = document.createElement('dd');
        dt.textContent = k;
        dd.textContent = v;
        stats.append(dt, dd);
      });
      info.hidden = false;
    }

    bodies.forEach(b => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = b.name;
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', () => select(selected === b ? null : b));
      chips.append(chip);
    });

    canvas.addEventListener('pointermove', e => {
      hovered = bodyAt(e.clientX, e.clientY);
      canvas.style.cursor = hovered ? 'pointer' : 'default';
    });
    canvas.addEventListener('pointerleave', () => { hovered = null; });
    canvas.addEventListener('click', e => select(bodyAt(e.clientX, e.clientY)));
    document.getElementById('close').addEventListener('click', () => select(null));

    function updateToggle() { toggle.textContent = running ? 'Pause' : 'Play'; }
    toggle.addEventListener('click', () => { running = !running; updateToggle(); });
    function updateSpeed() { speedLabel.textContent = speedInput.value + ' days/sec'; }
    speedInput.addEventListener('input', updateSpeed);

    window.addEventListener('resize', resize);
    resize();
    updateSpeed();
    updateToggle();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
