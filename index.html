<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aryan</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --fg: #1c1b19;
      --muted: #6b675f;
      --accent: #2f5d50;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151614;
        --fg: #ecebe6;
        --muted: #9a978f;
        --accent: #8fc7b3;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 32rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 1.125rem;
    }
    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 2px solid currentColor;
    }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <h1>Aryan</h1>
    <p>Welcome to my page.</p>
    <a href="https://github.com/ssgfhsap-lab">GitHub</a>
  </main>
</body>
</html>
